name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/*.apk output-apk/Instagram-AI-v1.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-AI-APK
          path: output-apk/Instagram-AI-v1.0.apk
          retention-days: 60

      - name: Publish GitHub Release (Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/Instagram-AI-v1.0.apk
          name: Instagram AI Release ${{ github.ref_name }}
          body: |
            ## 📱 Instagram AI - Android APK (${{ github.ref_name }})
            
            Instagram yapay zeka asistanı ve içerik danışmanı APK dosyası derlendi.
            
            ### 📥 Yükleme Adımları:
            1. Aşağıdaki **Assets** bölümünden `Instagram-AI-v1.0.apk` dosyasını indirin.
            2. Android cihazınızda indirdiğiniz dosyaya dokunun.
            3. "Bilinmeyen kaynaklardan yüklemeye izin ver" onayını verip kurulumu tamamlayın.
          draft: false
          prerelease: false
